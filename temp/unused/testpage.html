<!DOCTYPE html>
<html>
    <head>
        <style>
            :root {
                --charcoal: #595959ff;
                --grey: #7f7f7fff;
                --silver: #a5a5a5ff;
                --silver-2: #ccccccff;
                --white-smoke: #f2f2f2ff;
            }
            * {
                box-sizing: border-box;
            }
            body {
                background-color: black;
                color: white;
                margin: auto;
            }
            .outer {
                background-image: url(blue_velvet.png);
                background-repeat: repeat;
                margin: 2em auto;
                padding: auto;
                width: 95%;
            }
            .inner {
                background-color: black;
                width: 95%;
                margin: auto;
                padding: 2em;
            }
        </style>
    </head>

    <body>
        <div class="outer">
            <div class="inner">
                <h1>This is a practice website</h1>
                <p>Put some words here so the computer can show me what it does.</p>
            </div>
        </div>

    </body>


</html>
